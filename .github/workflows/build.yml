name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - run: msbuild MarbleScroll.sln /p:Configuration=Release /m /warnaserror
      - uses: actions/upload-artifact@v7
        with:
          name: MarbleScroll
          path: |
            MarbleScroll/bin/Release/MarbleScroll.exe
            MarbleScroll/bin/Release/MarbleScroll.exe.config
            MarbleScroll/bin/Release/LICENSE
          if-no-files-found: error
      - name: Test scroll engine
        run: |
          msbuild tests/ScrollEngineTests.csproj /p:Configuration=Release /warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tests\bin\Release\ScrollEngineTests.exe
          exit $LASTEXITCODE
      - name: Test mouse hook
        timeout-minutes: 5
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/e2e.ps1 -Exe MarbleScroll/bin/Release/MarbleScroll.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MarbleScroll
          path: release
      - name: Zip build artifact
        working-directory: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip "../MarbleScroll-${RELEASE_TAG}.zip" MarbleScroll.exe MarbleScroll.exe.config LICENSE
      - uses: softprops/action-gh-release@v3
        with:
          files: MarbleScroll-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
