name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild MarbleScroll.sln /p:Configuration=Release /m
      - uses: actions/upload-artifact@v4
        with:
          name: MarbleScroll
          path: |
            MarbleScroll/bin/Release/MarbleScroll.exe
            MarbleScroll/bin/Release/MarbleScroll.exe.config
